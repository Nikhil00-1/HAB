<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Dashboard | HAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Header -->
<header class="bg-emerald-700 text-white px-6 py-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold">🩺 Doctor Dashboard</h1>
  <span class="text-sm">Dr. Raj Agnani</span>
</header>

<main class="p-6 max-w-7xl mx-auto">

  <!-- Tabs -->
  <div class="flex gap-4 mb-6">
    <button id="tab-upcoming"
      class="px-5 py-2 rounded-lg bg-emerald-600 text-white font-semibold">
      Upcoming
    </button>

    <button id="tab-completed"
      class="px-5 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold">
      Completed
    </button>
  </div>

  <!-- Upcoming -->
  <div id="upcoming-section" class="bg-white rounded-xl shadow overflow-x-auto">
    <div class="p-5 border-b">
      <h2 class="text-xl font-semibold">📅 Upcoming Appointments</h2>
    </div>

    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-3 text-left">Patient</th>
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-left">Time</th>
          <th class="px-4 py-3 text-left">Session</th>
          <th class="px-4 py-3 text-left">Action</th>
        </tr>
      </thead>

      <tbody id="upcoming-body" class="divide-y"></tbody>
    </table>
  </div>

  <!-- Completed -->
  <div id="completed-section" class="bg-white rounded-xl shadow overflow-x-auto hidden mt-6">
    <div class="p-5 border-b">
      <h2 class="text-xl font-semibold">✅ Completed Appointments</h2>
    </div>

    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-3 text-left">Patient</th>
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-left">Time</th>
          <th class="px-4 py-3 text-left">Session</th>
          <th class="px-4 py-3 text-left">Status</th>
        </tr>
      </thead>

      <tbody id="completed-body" class="divide-y"></tbody>
    </table>
  </div>

</main>

<script>
  const upcomingBody = document.getElementById("upcoming-body");
  const completedBody = document.getElementById("completed-body");

  // Demo data (can later be replaced)
  let upcoming = JSON.parse(localStorage.getItem("upcoming")) || [
    {
      patient: "Amit Sharma",
      date: "2025-01-18",
      time: "09:40 AM - 10:20 AM",
      session: "Initial Consultation"
    }
  ];

  let completed = JSON.parse(localStorage.getItem("completed")) || [];

  function render() {
    upcomingBody.innerHTML = "";
    completedBody.innerHTML = "";

    upcoming.forEach((a, i) => {
      upcomingBody.innerHTML += `
        <tr>
          <td class="px-4 py-3 font-medium">${a.patient}</td>
          <td class="px-4 py-3">${a.date}</td>
          <td class="px-4 py-3">${a.time}</td>
          <td class="px-4 py-3">${a.session}</td>
          <td class="px-4 py-3">
            <button onclick="complete(${i})"
              class="px-4 py-1 bg-emerald-600 text-white rounded text-xs">
              Complete
            </button>
          </td>
        </tr>`;
    });

    completed.forEach(a => {
      completedBody.innerHTML += `
        <tr>
          <td class="px-4 py-3 font-medium">${a.patient}</td>
          <td class="px-4 py-3">${a.date}</td>
          <td class="px-4 py-3">${a.time}</td>
          <td class="px-4 py-3">${a.session}</td>
          <td class="px-4 py-3">
            <span class="text-green-700 bg-green-100 px-3 py-1 rounded-full text-xs">
              Completed
            </span>
          </td>
        </tr>`;
    });

    localStorage.setItem("upcoming", JSON.stringify(upcoming));
    localStorage.setItem("completed", JSON.stringify(completed));
  }

  function complete(index) {
    completed.push(upcoming[index]);
    upcoming.splice(index, 1);
    render();
  }

  // Tabs
  document.getElementById("tab-upcoming").onclick = () => {
    document.getElementById("upcoming-section").classList.remove("hidden");
    document.getElementById("completed-section").classList.add("hidden");
  };

  document.getElementById("tab-completed").onclick = () => {
    document.getElementById("completed-section").classList.remove("hidden");
    document.getElementById("upcoming-section").classList.add("hidden");
  };

  render();
</script>

</body>
</html>
