<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Doctor Dashboard | HAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-emerald-700 text-white px-6 py-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold">🩺 Doctor Dashboard</h1>
  <span class="text-sm">Dr. Raj Agnani</span>
</header>

<main class="p-6 max-w-7xl mx-auto">

  <div class="flex gap-4 mb-6">
    <button id="tab-upcoming" class="px-5 py-2 rounded-lg bg-emerald-600 text-white font-semibold">
      Upcoming
    </button>
    <button id="tab-completed" class="px-5 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold">
      Completed
    </button>
  </div>

  <div id="upcoming-section" class="bg-white rounded-xl shadow overflow-x-auto">
    <div class="p-5 border-b">
      <h2 class="text-xl font-semibold">📅 Upcoming Appointments</h2>
    </div>
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-3 text-left">Patient</th>
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-left">Time</th>
          <th class="px-4 py-3 text-left">Session</th>
          <th class="px-4 py-3 text-left">Action</th>
        </tr>
      </thead>
      <tbody id="upcoming-body"></tbody>
    </table>
  </div>

  <div id="completed-section" class="bg-white rounded-xl shadow overflow-x-auto hidden mt-6">
    <div class="p-5 border-b">
      <h2 class="text-xl font-semibold">✅ Completed Appointments</h2>
    </div>
    <table class="min-w-full text-sm">
      <thead class="bg-gray-100 text-gray-600">
        <tr>
          <th class="px-4 py-3 text-left">Patient</th>
          <th class="px-4 py-3 text-left">Date</th>
          <th class="px-4 py-3 text-left">Time</th>
          <th class="px-4 py-3 text-left">Session</th>
          <th class="px-4 py-3 text-left">Status</th>
        </tr>
      </thead>
      <tbody id="completed-body"></tbody>
    </table>
  </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const upcomingBody = document.getElementById("upcoming-body");
  const completedBody = document.getElementById("completed-body");

  async function loadAppointments(status) {
    const res = await fetch(`/api/get_appointments.php?doctor_id=1&status=${status}`);
    const data = await res.json();
    if (status === "upcoming") renderUpcoming(data);
    else renderCompleted(data);
  }

  function renderUpcoming(list) {
    upcomingBody.innerHTML = "";
    if (list.length === 0) {
      upcomingBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No upcoming appointments</td></tr>`;
      return;
    }
    list.forEach(a => {
      upcomingBody.innerHTML += `
        <tr>
          <td class="px-4 py-3 font-medium">${a.patient_name}</td>
          <td class="px-4 py-3">${a.appointment_date}</td>
          <td class="px-4 py-3">${a.appointment_time}</td>
          <td class="px-4 py-3">${a.session_type}</td>
          <td class="px-4 py-3">
            <button onclick="markCompleted(${a.id})"
              class="px-4 py-1 bg-emerald-600 text-white rounded text-xs">
              Complete
            </button>
          </td>
        </tr>`;
    });
  }

  function renderCompleted(list) {
    completedBody.innerHTML = "";
    if (list.length === 0) {
      completedBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No completed appointments</td></tr>`;
      return;
    }
    list.forEach(a => {
      completedBody.innerHTML += `
        <tr>
          <td class="px-4 py-3 font-medium">${a.patient_name}</td>
          <td class="px-4 py-3">${a.appointment_date}</td>
          <td class="px-4 py-3">${a.appointment_time}</td>
          <td class="px-4 py-3">${a.session_type}</td>
          <td class="px-4 py-3">
            <span class="text-green-700 bg-green-100 px-3 py-1 rounded-full text-xs">Completed</span>
          </td>
        </tr>`;
    });
  }

  window.markCompleted = async function(id) {
    await fetch(`/api/update_status.php?id=${id}&status=completed`);
    loadAppointments("upcoming");
    loadAppointments("completed");
  };

  document.getElementById("tab-upcoming").onclick = () => {
    document.getElementById("upcoming-section").classList.remove("hidden");
    document.getElementById("completed-section").classList.add("hidden");
    loadAppointments("upcoming");
  };

  document.getElementById("tab-completed").onclick = () => {
    document.getElementById("completed-section").classList.remove("hidden");
    document.getElementById("upcoming-section").classList.add("hidden");
    loadAppointments("completed");
  };

  loadAppointments("upcoming");
});
</script>

</body>
</html>
