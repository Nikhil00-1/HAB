<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naturopathy Booking | HAB</title>

  <!-- Use local Tailwind build in production -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 overflow-x-hidden">

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200 shadow-sm px-6 py-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <img src="HABlogo.jpeg" class="w-14">
      <button onclick="location.href='index.html'"
        class="px-6 py-2 bg-gradient-to-r from-slate-900 to-teal-700 text-white rounded-full">
        Back to Home
      </button>
    </div>
  </nav>

  <!-- FORM + SUMMARY -->
  <section class="px-6 py-14">
    <div class="max-w-6xl mx-auto grid lg:grid-cols-3 gap-8">

      <!-- BOOKING FORM -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-3xl p-8 border shadow-lg">
          <h1 class="text-3xl font-bold mb-6 flex items-center gap-2">
            <i data-lucide="leaf" class="text-teal-700"></i> Book Your Naturopathy Session
          </h1>

          <form id="bookingForm" class="space-y-6" enctype="multipart/form-data">
            <input type="hidden" name="session" value="Initial Consultation (30 min) — $50" />

            <input name="name" placeholder="Full Name" required class="w-full px-4 py-3 rounded-xl border" />
            <input name="email" type="email" placeholder="Email" required class="w-full px-4 py-3 rounded-xl border" />
            <input name="phone" placeholder="Phone" required class="w-full px-4 py-3 rounded-xl border" />

            <!-- DOCTOR SELECTION (FIXED) -->
            <select name="doctor_id" required class="w-full px-4 py-3 rounded-xl border">
              <option value="">Select Practitioner</option>
              <option value="1">Raj Agnani</option>
            </select>

            <input type="date" name="date" required class="w-full px-4 py-3 rounded-xl border" />

            <select name="time" id="time-select" required class="w-full px-4 py-3 rounded-xl border">
              <option value="">Select Time</option>
            </select>

            <div>
              <label class="block mb-1 font-medium">Upload Medical Report</label>
              <input type="file" name="medical_report" accept=".pdf,.jpg,.jpeg,.png"
                class="w-full px-4 py-3 rounded-xl border" />
            </div>

            <textarea name="message" placeholder="Health goals" class="w-full px-4 py-3 rounded-xl border"></textarea>

            <button type="submit"
              class="w-full py-4 rounded-xl font-bold bg-gradient-to-r from-slate-900 to-teal-700 text-white">
              Proceed to Payment
            </button>
          </form>
        </div>
      </div>

      <!-- SUMMARY -->
      <div class="lg:col-span-1">
        <div class="bg-white rounded-3xl p-6 border shadow-lg sticky top-8">
          <h3 class="text-xl font-bold mb-6">Booking Summary</h3>
          <div class="space-y-4 mb-6">
            <div class="flex gap-3"><i data-lucide="brain" class="text-teal-700"></i>
              <div>
                <div class="text-sm text-slate-500">Therapy Type</div>
                <div class="font-semibold">Naturopathy</div>
              </div>
            </div>
            <div class="flex gap-3"><i data-lucide="clock" class="text-teal-700"></i>
              <div>
                <div class="text-sm text-slate-500">Session</div>
                <div class="font-semibold">Initial Consultation (30 min)</div>
              </div>
            </div>
          </div>
          <div class="border-t pt-4 flex justify-between font-bold text-lg">
            <span>Total Amount</span><span class="text-teal-700">$50</span>
          </div>

          <div class="bg-slate-100 rounded-xl p-4 space-y-3">
            <div class="flex items-center space-x-2 text-sm">
              <i data-lucide="check-circle" class="w-4 h-4 text-green-600"></i><span>Certified Practitioners</span>
            </div>
            <div class="flex items-center space-x-2 text-sm">
              <i data-lucide="check-circle" class="w-4 h-4 text-green-600"></i><span>Secure Payment</span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>

  <!-- PAYMENT MODAL -->
  <div id="payment-modal"
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-[9999] opacity-0 pointer-events-none transition">
    <div class="w-[380px] rounded-3xl p-8 bg-white shadow-2xl relative">

      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400">
        <i data-lucide="x"></i>
      </button>

      <h2 class="text-xl font-bold text-center mb-5">Scan & Pay</h2>

      <div class="flex justify-center mb-6">
        <img src="./assets/images/QR_code1.jpg" class="w-[200px] rounded-xl shadow" />
      </div>

      <input id="transaction-id" placeholder="Transaction ID" class="w-full px-4 py-3 mb-5 border rounded-xl" />

      <button onclick="finishPayment()"
        class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-teal-700 to-slate-900 text-white">
        Finish Payment
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    /* TIME SLOTS */
    const timeSelect = document.getElementById("time-select");
    let current = new Date(); current.setHours(9, 0, 0, 0);
    const end = new Date(); end.setHours(22, 0, 0, 0);
    while (current < end) {
      const next = new Date(current.getTime() + 30 * 60000);
      const opt = document.createElement("option");
      opt.value = opt.textContent =
        current.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit', hour12: true })
        + " - " +
        next.toLocaleTimeString("en-IN", { hour: '2-digit', minute: '2-digit', hour12: true });
      timeSelect.appendChild(opt);
      current = next;
    }

    /* VALIDATION + OPEN MODAL */
    document.getElementById("bookingForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const fd = new FormData(this);

      if (!fd.get("name") || !fd.get("email") || !fd.get("time") || !fd.get("doctor_id")) {
        alert("Missing required fields");
        return;
      }

      document.getElementById("payment-modal").classList.remove("opacity-0", "pointer-events-none");
    });

    /* CLOSE MODAL */
    function closeModal() {
      document.getElementById("payment-modal").classList.add("opacity-0", "pointer-events-none");
    }

    /* FINAL PAYMENT */
    async function finishPayment() {
      const txn = document.getElementById("transaction-id").value.trim();
      if (!txn) return alert("Enter Transaction ID");

      const fd = new FormData(document.getElementById("bookingForm"));
      fd.append("transactionId", txn);

      try {
        const res = await fetch("/api/create_booking.php", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.success) return alert(data.error || "Booking failed");

        alert("Booking Confirmed ✅");
        location.reload();
      } catch (err) {
        alert("Server error");
      }
    }
  </script>

</body>

</html>
